<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e2e" />
  <title>Singlish → Sinhala Converter</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS + Catppuccin Mocha Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            mocha: {
              base: '#1e1e2e',
              mantle: '#181825',
              crust: '#11111b',
              text: '#cdd6f4',
              subtext: '#a6adc8',
              overlay: '#6c7086',
              surface0: '#313244',
              surface1: '#45475a',
              mauve: '#cba6f7',
              blue: '#89b4fa',
              lavender: '#b4befe',
              red: '#f38ba8',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for Catppuccin feel */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #181825; 
    }
    ::-webkit-scrollbar-thumb {
      background: #45475a; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #585b70; 
    }
    
    /* Accessible Skip Link */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 50;
    }
    .skip-link:focus {
      left: 12px;
      top: 12px;
    }

    /* Gradient Background Glow */
    .bg-glow {
      background: radial-gradient(circle at 15% 50%, rgba(203, 166, 247, 0.08), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(137, 180, 250, 0.08), transparent 25%);
    }
  </style>
</head>
<body class="bg-mocha-base text-mocha-text font-sans antialiased min-h-screen flex flex-col bg-glow selection:bg-mocha-mauve selection:text-mocha-base">

  <a class="skip-link px-4 py-2 bg-mocha-mauve text-mocha-base font-bold rounded shadow-lg" href="#converter">Skip to editor</a>

  <!-- Header -->
  <header class="w-full max-w-4xl mx-auto pt-8 pb-4 px-5 flex items-center justify-center sm:justify-between">
    <div class="flex items-center gap-3">
      <!-- Logo -->
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-mocha-mauve to-mocha-blue text-mocha-base font-bold text-xl shadow-[0_0_15px_rgba(203,166,247,0.3)]" aria-hidden="true">
        සි
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-mocha-text">Singlish → Sinhala</h1>
    </div>
    
    <!-- Hidden input to maintain logic functionality for "Phonetic" without showing the toggle -->
    <!-- We keep the ID and value so script.js finds the checked input -->
    <div class="hidden">
      <input type="radio" name="type" value="phonetic" id="phonetic" checked />
    </div>
  </header>

  <main class="flex-1 w-full max-w-4xl mx-auto px-5 pb-10">
    
    <!-- Status Indicator (Replaces the switch) -->
    <div class="flex justify-center mb-6">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-mocha-surface0 border border-mocha-surface1 text-xs font-medium text-mocha-mauve bg-opacity-50 backdrop-blur-sm">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-mocha-mauve opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-mocha-mauve"></span>
        </span>
        Phonetic Mode Active
      </div>
    </div>

    <!-- Editor Card -->
    <section class="relative group">
      <!-- Glow effect behind card -->
      <div class="absolute -inset-0.5 bg-gradient-to-r from-mocha-mauve to-mocha-blue rounded-2xl opacity-20 blur transition duration-500 group-hover:opacity-40"></div>
      
      <div class="relative bg-mocha-mantle border border-mocha-surface0 rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Toolbar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border-b border-mocha-surface0 bg-mocha-mantle/50">
          <p class="text-sm text-mocha-subtext font-medium">Type in Singlish &mdash; Get Sinhala</p>

          <div class="flex items-center gap-2 w-full sm:w-auto">
            <!-- Clear Button -->
            <button class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 py-2 text-sm font-medium text-mocha-subtext hover:text-mocha-text hover:bg-mocha-surface0 rounded-lg transition-colors border border-transparent hover:border-mocha-surface1" data-action="clear" type="button" title="Clear text">
              <svg viewBox="0 0 24 24" class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
              Clear
            </button>
            
            <!-- Copy Button -->
            <button class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 py-2 text-sm font-medium text-mocha-subtext hover:text-mocha-text hover:bg-mocha-surface0 rounded-lg transition-colors border border-transparent hover:border-mocha-surface1" data-action="copy" type="button" title="Copy text">
              <svg viewBox="0 0 24 24" class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy
            </button>
            
            <!-- Download Button -->
            <button class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold text-mocha-base bg-mocha-mauve hover:bg-opacity-90 rounded-lg shadow-lg shadow-mocha-mauve/20 transition-all active:translate-y-0.5" data-action="download" type="button" title="Download as .txt">
              <svg viewBox="0 0 24 24" class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Save
            </button>
          </div>
        </div>

        <!-- Textarea -->
        <textarea
          id="converter"
          class="w-full h-[50vh] min-h-[350px] p-5 bg-transparent text-lg text-mocha-text placeholder-mocha-overlay resize-y outline-none focus:ring-0 leading-relaxed font-medium"
          placeholder="Start typing here..."
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Singlish input to convert"
        ></textarea>
      </div>
    </section>

    <footer class="mt-8 text-center">
      <div class="text-xs text-mocha-overlay flex items-center justify-center gap-2">
        <span>Powered by Singlish</span>
        <span class="w-1 h-1 rounded-full bg-mocha-surface1"></span>
        <a href="https://github.com/chami2000/Singlish" rel="noopener" class="text-mocha-blue hover:text-mocha-mauve transition-colors underline decoration-mocha-blue/30 underline-offset-4">View Source</a>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
